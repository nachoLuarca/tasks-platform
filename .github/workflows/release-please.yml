name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    steps:
      # On every push to main: opens or updates the release PR from the
      # Conventional Commits since the last release. When that PR is merged,
      # this same run creates the vX.Y.Z tag and the GitHub release instead.
      - name: Run release-please
        uses: googleapis/release-please-action@v4.4.1
        with:
          # A PR opened with the default GITHUB_TOKEN doesn't trigger other
          # workflows, so CI would never run on the release PR and main's
          # required checks would block it. RELEASE_PLEASE_TOKEN is a
          # fine-grained PAT (Contents and Pull requests: read and write) that
          # avoids that; without the secret it falls back to GITHUB_TOKEN.
          # See CONTRIBUTING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
